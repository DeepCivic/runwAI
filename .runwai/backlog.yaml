# runwAI development backlog.
#
# runwAI's own outstanding work. Not the adopting project's backlog, and not the
# security backlog that TODO-10 will generate from scanner findings.
#
# README section.
#
# Reviewed 2026-07-28 against MAINTAINERS.md and decisions.yaml. Each item carries a
# `review` block: the recommendation, the alignment argument, and where an acceptance
# criterion conflicts with an accepted decision, the honest rewording. id_2 (resolved
# at the presentation layer, decision 8), id_4 (reshaped by the maintainer to "either
# language, same first session", then implemented) and id_3 (/explain, riding on the
# registry with no new tooling) closed the same day. Open work: id_1 — the good-change
# test made literal, and the receipt /explain will cite once it lands.

# .runwai/backlog.yaml

id_1:
    title: Verification capability for security setup
    description: |
      One-command verification that security checks are functioning correctly.
      Uses deliberately vulnerable test cases from controls/fixtures to prove:
      - All active security rules are properly installed and working
      - No false negatives on known vulnerable patterns
      - Results are consistent across runs
      
      Output must be interpretable by non-security experts:
      "All verification tests passed" or specific actionable failures
      
      Solves: Business users need to prove to IT that security checks actually work
    priority: critical
    status: proposed
    value: |
      Enables business users to have credible conversations with IT teams about security posture
      Closes the circular dependency: non-experts can verify setup without security knowledge
      Transforms security report from "just another tool" to verifiable evidence
    acceptance_criteria:
      - "runwai verify returns clear pass/fail status"
      - "Uses 3+ deliberately vulnerable test cases per active rule"
      - "Output understandable by business users with no security expertise"
      - "Verification process itself is secure (cannot be bypassed)"
    review:
      date: "2026-07-28"
      recommendation: implement-first
      alignment: >-
        This is the good-change test made literal: "adds verifiable receipts for claims".
        The report currently asserts that nine rules enforce; verification proves they
        fire, which is the difference between a claim and a receipt. Most of the machinery
        already exists — controls/tests/ asserts every active rule in both directions and
        `semgrep --test` already runs it — so the work is a plain-language wrapper, not a
        new check.
      corrections: >-
        Two acceptance criteria conflict with accepted decisions and need rewording, not
        the item rejecting. First, "runwai verify" implies an installed CLI; the template
        is not a Python package (decision 3) and .runwai/tools/ is maintainer-only and
        deletable by the adopter, so verification must live where deletion of .runwai/
        cannot take it: ship it as `python3 .github/scripts/verify.py`, beside
        security_report.py, invoked the same way. Second, "cannot be bypassed" is a
        gate-shaped claim of exactly the kind decision 6 removed — nothing here can force
        anything to run. The honest property is tamper-evidence, not bypass-proofing:
        every verification input (fixtures, rule files, tool versions) is committed and
        pinned, so a tampered setup fails verification visibly, and the output states
        plainly that nothing forces verification to run.
      proposed_implementation:
        - >-
          `.github/scripts/verify.py`: adopter-facing, offline, deterministic, stdlib +
          the already-pinned scanners. House exit codes (0 pass, 1 fail, 2 could-not-run).
        - >-
          Rule receipts: run `semgrep --test --config controls/rules controls/tests` with
          the pinned semgrep, parse the JSON result, and report per rule in plain
          language: "fired on N known-vulnerable cases, stayed silent on M safe cases".
        - >-
          Secret-scan receipt: run detect-secrets-hook against a committed canary fixture
          in controls/tests/ and require a non-zero exit. The canary and an exclude line
          for it in .pre-commit-config.yaml land in the same commit, mirroring how the
          semgrep fixtures are excluded today.
        - >-
          Hook-installed receipt: report whether `.git/hooks/pre-commit` exists. If not,
          say what that means — "the commit-time checks are not installed; nothing will
          run when you commit" — with the two install commands. Distinct from a rule
          failure, because the remedy is different.
        - >-
          Determinism receipt: run the rule suite twice and require identical verdicts,
          which is the "consistent across runs" criterion made checkable.
        - >-
          An honesty block closing the output, whatever the verdict: the ten active
          rules were verified, not broad coverage; `--no-verify` walks past the hook;
          verified checks mean the checks work, not that the code is secure.
        - >-
          Fixture floor: at least three `ruleid:` cases per active rule. Currently
          runwai-js-unsafe-eval-deserialisation has two; pad where short, in the same
          commit as the floor is asserted.
        - >-
          Wiring: a posture.yml step runs verify.py and publishes to the job summary, and
          security_report.py gains one line sourced from it — "active rules verified
          against their fixtures" with the date — so the report's claims carry the
          receipt. AGENTS.md first-session flow and README get one line each
          (MAINTAINERS.md ALWAYS rules).

id_2:
    title: Inverted configuration management
    description: |
      Config files start in .tools/ directory and are selectively unpacked to root
      
      - All tool configs begin in .tools/ directory (biome.json, playwright.config.ts, etc.)
      - Verification script has params to unpack ONLY relevant configs based on project type
      - Agent detects project type (Python, JS, etc.) and unpacks only needed configs
      - No unnecessary files ever appear at root - clean from first commit
      
      Solves: Root directory clutter creates cognitive overload for business users
    priority: high
    status: resolved
    value: |
      Aligns with "you should not have to know what to ask for" philosophy
      Prevents initial visual clutter rather than requiring cleanup
      First impression shows only what's relevant to THIS project
      Supports "vibe coder gets 70% there" by removing decision burden
    acceptance_criteria:
      - "All tool configs start in .tools/ directory in template"
      - "runwai verify --project-type=python unpacks only relevant configs"
      - "Root directory contains ONLY config files relevant to detected project type"
      - "Original configs remain fully functional in .tools/ when not unpacked"
      - "No manual cleanup required by business users"
    review:
      date: "2026-07-28"
      recommendation: resolved-at-presentation-layer
      clarified_intent: >-
        Maintainer clarification, 2026-07-28: the item responds to the experience of
        seeing this repository on GitHub, where the root listing reads as bizarre next
        to repositories a visitor already knows. That is the template's own first
        impression, which the first-session delete path cannot reach — a visitor sees
        the root before they ever clone. An earlier draft of this review read the item
        as adopter-side clutter and recommended rejection outright; the clarification
        narrows what is rejected to the mechanism alone.
      alignment: >-
        The mechanism as filed — configs waiting in .tools/ for a selective unpack —
        stays rejected: decision 2 names that exact alternative and rejects it, and the
        files it would move are the ones whose root placement is load-bearing. The
        clarified need is real, and it is met without moving anything a tool reads.
        Decision 8 records the rule: a file earns its root slot because a tool or
        convention reads it there, or because it is the artefact the repository exists
        to hand the adopter; everything that is runwAI's own record lives in .runwai/.
      disposition: >-
        Done under decision 8: report.md, the maintainer-facing self-check readout,
        moved to .runwai/report.md — no tool read it at root, and beside
        security-report.md it was the most confusing pair a visitor could meet first —
        and README.md's "Where things are" now opens by saying the root is busier than
        most repositories and why. Deleting .runwai/ takes the readout with it, so the
        AGENTS.md first-session prune list got one item shorter. If the root still
        reads as bizarre after this, the remaining lever is forge-side (repository
        description and topics), which no file in a template can set.

id_3:
    title: Contextual ISM interpreter command
    description: |
      Agent command that provides ISM mapping ONLY when explicitly requested:
      "/runwai explain RWA-00XX"
      
      Returns:
      - Plain English explanation of what the control means for THIS project
      - Direct instructions for agent to fix ("Replace X with Y in file.py")
      - Technical verification details (only when requested)
      
      Solves: Business users need to answer IT questions about compliance without being security experts
    priority: medium
    status: resolved
    value: |
      Respects "don't need to know" principle - compliance details hidden until needed
      Provides verifiable mapping when business users need to bridge gap to IT
      Maintains clean root directory (no extra files)
      Solves verification cascade by delivering exactly what's needed when needed
    acceptance_criteria:
      - "Command works without security knowledge"
      - "Output includes plain English fix instructions for agent"
      - "Technical ISM details hidden by default, visible only when requested"
      - "Verification details include upstream source and version"
    review:
      date: "2026-07-28"
      recommendation: implemented
      alignment: >-
        Aligned, and cheap: everything the command needs to say already exists as
        structured data (registry.yaml carries ism_text verbatim, mapping_fidelity,
        notes and implementation.provenance; ism-index.json carries the semantic join).
        No determinism conflict — the invariant bars a model from adjudicating a
        control, not from explaining one; nothing here enters a decision path.
      disposition: >-
        Implemented per decision 4 and the decision 8 membership test, leveraging what
        already ships: no new tool, no script, no dependency. Canonical content is
        agents/knowledge/explaining-a-control.md — read every fact from
        controls/registry.yaml or controls/ism-snapshot.json at answer time, never
        memory; plain language first; explain, never adjudicate; a mapped control with
        no implementation block is stated as "nothing runs", never implied covered;
        ISM text, IDs, tool versions and the verification receipt (source, date,
        ism_release with its snapshot SHA-256 — the "upstream source and version"
        criterion) hidden until asked. .claude/commands/explain.md is a thin adapter
        holding nothing of its own, and everything the command reads lives outside
        .runwai/, so it survives the adopter's prune. Indexed in agents/README.md and
        llms.txt; the root README points to it where a reader meets the control rows.
        Originally sequenced after id_1 so "how do I prove this works" has a receipt
        to cite; implemented first at the maintainer's direction — when id_1 lands,
        add one line to the knowledge file pointing at verify.py.

id_4:
  title: Either language, same first session
  description: |
    Reshaped by the maintainer, 2026-07-28. The requirement is not "mirror every rule":
    it is that it does not matter whether someone starts Python or Node — the agent has
    what it needs to get them set up.

    Original title was "Node mirrors to Python", asking for equivalent Node.js rules
    for all active controls, package.json detection, and per-language configuration.
    The review below records why blanket mirroring was the wrong target and what the
    reshaped requirement actually needed.
  priority: high
  status: resolved
  value: |
    Enables the "vibe coder" workflow identically for JavaScript/TypeScript developers
    Makes the tool genuinely multi-language rather than Python-first with JS tooling
    Keeps security posture reporting structure identical across language ecosystems
  acceptance_criteria:
    - "The one-step first session is identical for a Python and a Node project"
    - "Each sink class an active rule covers is covered in both languages, or the rule file records why no equivalent exists"
    - "Every rule, either language, is asserted in both directions by a committed fixture"
    - "security-report.md shows identical structure regardless of project language"
  review:
    date: "2026-07-28"
    recommendation: implemented-as-reshaped
    alignment: >-
      The premise of the original wording overstated the gap: the setup flow was already
      language-neutral — one hook, semgrep running on python, javascript and ts file
      types, rules language-scoped so a project without one language simply never
      triggers its rules, and no per-language configuration step for a detector to
      choose. Detection would have added a step to a flow whose whole point is having
      one. Three rules were already JS/TS with both-direction fixtures. Blanket
      mirroring also fails the bad-change test (checks added faster than the honesty
      layer can describe them) and repeats the recorded RWA-0023 failure: JS rules
      shipped without fixtures, asserted in neither direction, retired in v1.
    disposition: >-
      Implemented as a per-sink-class gap analysis. The one real gap was shell command
      injection: Python had runwai-python-shell-injection, Node had nothing. Closed with
      runwai-js-shell-injection (child_process exec and execSync, template-literal and
      concatenation forms, bare and qualified receivers), asserted in both directions by
      four vulnerable and four safe fixtures — including RegExp.prototype.exec, which
      the receiver anchor deliberately excludes — and the rule count updated from nine
      to ten across README.md, AGENTS.md, docs/setup.md, MAINTAINERS.md and status.md
      in the same commit. Asymmetries that remain are recorded, not implied away:
      pickle-format model loading has no Node equivalent (nothing to mirror), eval-based
      deserialisation has no Python mirror the other way, and the JS shell rule's
      known-uncovered forms (spawn with shell true, indirectly assembled commands) are
      documented in the rule file where a maintainer extending it will look. The two
      original criteria that belonged to other items went back to them: root-config
      selection was id_2 (resolved, decision 8), language-appropriate remediation is
      id_3's output.
sequencing_note: >-
  id_1 is the keystone of what remains: its per-rule receipts are what id_3 cites
  when a user asks "how do I prove this works". runwai-js-shell-injection landed
  meeting id_1's fixture floor (four vulnerable cases); the floor still needs
  asserting mechanically, and runwai-js-unsafe-eval-deserialisation padding to
  three, when id_1 is built.