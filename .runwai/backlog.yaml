  - id: TODO-13
    title: Semantic tags for every ISM control
    state: closed
    phase: closed
    v1: true
    summary: >-
      A machine-friendly breakdown of all 1101 ISM controls, each carrying semantic tags and
      a code/infrastructure/organisational surface, so everything downstream reads the
      judgement rather than re-deciding it.
    resolution: >-
      Two files and a subcommand. controls/ism-tags.yaml holds runwAI's judgement — a
      closed 43-tag vocabulary, three surfaces, one entry for each of the 70 guideline+section
      pairs, and an override list. controls/ism-index.json is generated from it:
      1101 records, each with the control text, its tags, its surfaces, whether those came
      from the section or an override, and the rationale prose. `ism.py index` writes it,
      `ism.py index --check` fails when it is stale, and both gates run the check.
    kept_separate_from_the_snapshot: >-
      The open question about where tags live is settled: beside the snapshot, not in it.
      ism-snapshot.json is (c) Commonwealth of Australia under CC BY 4.0 and ism-tags.yaml
      is ours under Apache-2.0. Keeping them apart means neither licence has to be argued
      about when either file is reused, and it makes runwAI's judgement separately
      reviewable from the ISM's facts.
    source_text_used: >-
      controls/ism-source.txt turned out to carry something the snapshot drops entirely: a
      sub-heading and an explanatory paragraph before each group of controls, saying why
      they exist. 1077 of 1101 controls now carry that rationale. It is located by
      subtraction rather than by pattern — everything between the end of the previous
      control's known text and the next control marker is the next one's preamble — so it
      needs no guess about where a control's own wording stops. Rationale attaches to a
      topic, not a control: 450 topics, 444 blocks in the published text.
    honesty_correction: >-
      The first generated index carried an `automatable_count` of 754, being every control
      with a code or infrastructure surface. That was an overclaim and the field is gone.
      A surface says where a control's evidence lives, never that runwAI can reach it:
      ISM-0260 requires all web access to go through web proxies, carries `infrastructure`,
      and no repository declares it. The index now reports counts per surface, which are
      facts, and says so on its face.
    evidence:
      method: measured by running the generator against the committed snapshot and source
      controls: 1101
      guidelines: 22
      guideline_section_pairs: 70
      topics: 450
      vocabulary_size: 43
      overrides: 3
      per_surface: {code: 239, infrastructure: 646, organisational: 694}
      rationale_coverage: 1077
      failure_modes_asserted:
        - tag outside the vocabulary
        - surface outside the declared set
        - a section present in the snapshot with no entry in the tags file
        - an override with no reason
        - an override naming a control that does not exist
        - a stale committed index
    notes: >-
      The three overrides — ISM-1876, ISM-1690 and ISM-2032 — were each checked against
      their text in the snapshot before being written. The list stays short deliberately: a
      long override file written in one sitting reintroduces the unreviewable problem the
      section-level design exists to avoid.

  - id: TODO-12
    title: Ship working files, not templates of files
    state: closed
    phase: closed
    summary: >-
      templates/ held five files that did nothing until someone knew they existed and knew
      where to copy them — the same failure this repository names at the top, one directory
      down. Inert content is indistinguishable from absent content to the person it was
      written for, and indistinguishable from coverage to everyone else.
    resolution: >-
      templates/ is gone. biome.json, playwright.config.ts and promptfooconfig.yaml ship
      live at the root where each tool already looks; templates/AGENTS.md and
      templates/llms.txt were deleted as decoy copies of two files that are already live
      and correct at the root. Recorded in .runwai/decisions/0002, which partially
      supersedes ADR-0001's live/inert table.
    consequences_settled:
      - .semgrepignore no longer excludes them. Measured after promotion — semgrep over all
        four rulesets scans playwright.config.ts and reports 0 findings. Two of those
        rulesets were retired by TODO-14; the measurement stands for the tree as it was.
      - The templates/README.md caveat that these files are unexercised was replaced by an
        actual check. validate_helpers.py now asserts each root config parses, declares an
        exact version, and matches the version table in README.md.
      - "check_templates became check_root_configs; report.py dropped its template count.
        The distinction the code now encodes: unexercised is acceptable and must be stated,
        inert is not."
    notes: >-
      The task that prompted the item — vendored commands and skills landing as working
      files — was already satisfied before the item was worked: .claude/commands/ and
      agents/skills/ were live. What remained was the five files in templates/.
      TODO-10's artefact inherits the rule: the ISM posture readout ships as a draft with
      real content, never as a blank template of a system security plan.

