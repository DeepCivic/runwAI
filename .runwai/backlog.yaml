# runwAI development backlog.
#
# runwAI's own outstanding work. Not the adopting project's backlog, and not a security
# backlog generated from scanner findings.
#
# Policy: only outstanding items live here. An item that is completed or rejected is
# deleted in the commit that closes it — its record is that commit's message, which
# cites the item's id, and .runwai/decisions.yaml where closing it changed the
# template's shape. IDs are stable and never reused: the next item is id_10, whatever
# became of id_1 through id_9.
#
# When nothing is outstanding, only this header and the template below remain.
#
# Template for a new item:
#
# id_10:
#   title: One line, imperative
#   description: |
#     What it is, and the problem it solves.
#   priority: critical | high | medium | low
#   status: proposed
#   value: |
#     Why it is worth doing, argued in the template's own terms (MAINTAINERS.md).
#   acceptance_criteria:
#     - "Checkable statements, honest about what cannot be enforced"

id_5:
  title: Rebalance the commit-time gate against where each check can honestly run
  description: |
    `.pre-commit-config.yaml` runs seven blocking hooks: the secret scan, SAST over staged
    files, and five structural self-checks — the registry validator, ISM claim verification,
    the ISM index staleness check, the helper-layer check and the report freshness check.
    That makes saving work the heaviest gate in the repository, when the stated design is
    fast checks on save and the full set where it reports.

    Commit time is for what must never enter history, which is a leaked credential. The
    structural checks are about runwAI's own coherence: they need the whole tree, they are
    not about the change being saved, and `.github/workflows/posture.yml` already re-runs
    every one of them.

  priority: medium
  status: proposed
  value: |
    A gate in the wrong place is not a weakened gate, and this one has not been weakened —
    nothing was moved after it failed. But it is still the gate the maintainer meets most
    often, and the cost of getting the placement wrong is paid on every commit. The rule in
    AGENTS.md is to put a check where it can actually see the problem; the repository does
    not currently follow its own rule about itself.

    Moving a check after it fails is weakening it, so this has to be decided as design and
    recorded as a decision, not done the next time a hook is inconvenient.
  acceptance_criteria:
    - "A decision record states which checks run at commit time and why, in terms of what
       each one can see there"
    - "The secret scan stays on the commit hook: a credential that reaches a push is
       already public and must be rotated rather than deleted"
    - "Every check moved off the commit hook is verified as already running in
       .github/workflows/posture.yml, named job by named job, before it is removed"
    - "Hook counts in .runwai/status.md and AGENTS.md's deletion instructions are corrected
       in the same commit"
  not_enforceable: |
    Nothing mechanically checks that a check sits where it can see its subject matter. This
    stays a review judgement, which is why it is written down rather than automated.

id_6:
  title: Known vulnerable dependencies (CVEs)
  description: |
    Add offline, deterministic CVE auditing across all detected package managers.
    - Implement `make audit` that runs `pip-audit`, `npm audit` and `cargo audit` in parallel
    - Cache the local vulnerability databases (`.audit-cache/`) to keep checks offline and
      reproducible
    - Generate a dependency bill-of-materials (SBOM) in `docs/dependencies.md` during
      `first-session`
    - Append audit results to `docs/security-report.md` under a new "Dependency Posture"
      section
    - **Do not** wire this into the commit hook — run it in CI only, so it reports rather
      than blocks

    Solves: the current checks read source files and say nothing about the third-party
    packages that code depends on.
  priority: high
  status: proposed
  value: |
    Catches known CVEs without requiring anyone to monitor mailing lists.
    Keeps the green report honest — a clean codebase on a vulnerable dependency is not
    secure, and today the report does not distinguish the two.
    Deterministic in the sense this repository means it: same lockfile plus same database
    snapshot yields the same verdict on every run, with no model in the decision path.
    Audits each lockfile it finds, so a repository holding more than one ecosystem is
    covered per ecosystem rather than at whichever one was detected first.
  acceptance_criteria:
    - "`make audit` runs with zero network calls after an initial `make setup-audit-dbs`"
    - "Each language's audit tool runs only if its lockfile exists (Pipfile.lock,
       package-lock.json, Cargo.lock) and reports `not applicable` otherwise, distinctly
       from a pass"
    - "The security report separates dependency CVEs from code-level findings"
    - "A failing audit does not abort `git commit` or `make first-session` — it annotates
       the run"
    - "Every audit tool is pinned to an exact version, or recorded `install: unavailable`
       with no version at all"

id_7:
  title: Path traversal and unsafe file operations
  description: |
    Add deterministic semgrep rules for unsafe file path handling.
    - Implement `controls/rules/path-traversal.yaml` with two rules:
      - Rule A: unsanitised user input passed to file system APIs (`open()`,
        `fs.readFileSync`)
      - Rule B: missing path canonicalisation before `os.path.join` or `path.join`
    - Create fixtures at `controls/tests/path-traversal.py` and
      `controls/tests/path-traversal.js`, asserting each rule in both directions
    - Add a control record per rule in `controls/registry.yaml`, with an ISM ID read
      verbatim from `controls/ism-snapshot.json` and a pessimistic `mapping_fidelity`
    - Extend `.github/scripts/verify.py` to prove both rules fire on their fixtures
    - Document the known false-positive classes at the top of the rule file

    Solves: the current injection rules catch SQL, shell and HTML sinks but miss the
    simplest file-read exploit.
  priority: high
  status: proposed
  value: |
    Path traversal is the obvious neighbour of the sink classes already covered, and it is
    mechanically detectable in the same way — no new tool, no new gate, one more ruleset
    behind the same pinned semgrep.
    Near-zero false positives when scoped to unsanitised variables reaching a file API,
    rather than to every path join.
    It is the kind of mistake an agent writing code for a non-expert makes silently:
    `open(f"/var/{user}")` looks like working code and reviews as working code.
  acceptance_criteria:
    - "Both rules fire on their vulnerable fixtures and stay silent on the safe ones, under
       `semgrep --test --config controls/rules controls/tests`"
    - "Rules cover Python (os.path.join, pathlib) and Node (path.join, fs)"
    - "`verify.py` includes path traversal in its assertion suite, meeting the fixture floor
       of three vulnerable and one safe case per rule"
    - "The rule count is corrected wherever it is stated — README.md, docs/setup.md,
       .runwai/status.md and .runwai/MAINTAINERS.md all say ten today"
    - "`/explain` remediation names the canonicalisation function per language (realpath,
       resolve)"

id_8:
  title: Environment and runtime parity check (`make doctor`)
  description: |
    Add a deterministic environment sanity check for the adopter's project.
    - Reads `.env.example` or `config.schema.json` and verifies every required variable is set
    - Compares runtime versions (`python --version`, `node --version`) against the pinned
      `.tool-versions` or equivalent
    - Checks that the directories the project declares it writes to are writable
    - Flags set-but-unused environment variables, to catch drift from old configs
    - Adds a `make doctor` target, and reports its result during `make first-session`

    Solves: missing environment variables and mismatched runtimes, which is where a working
    setup silently stops being reproducible.
  priority: medium
  status: proposed
  value: |
    Deterministic and offline: it reads declared state and compares it to actual state, with
    no model and no network.
    It fits the one-step onboarding promise — the adopter's agent can report "your
    environment is ready", or name exactly what is missing, without the adopter knowing to
    ask.
    It reports and does not block, which is the posture the rest of the template already
    takes.
  acceptance_criteria:
    - "`make doctor` exits with a human-readable pass/fail summary"
    - "Missing required variables exit non-zero in CI and do not block commits"
    - "A project that declares no environment requirements reports `not applicable`, not a
       pass"
    - "Runtime version mismatches are reported with the command that fixes them"

id_9:
  title: Inter-service API contract checking
  description: |
    Add a deterministic contract check that validates API compatibility between components
    that are versioned separately.
    - Parse OpenAPI/AsyncAPI specs or protobuf definitions from each component
    - Run the consumer's committed example requests and responses against the producer's
      schema
    - Flag mismatches: missing fields, type changes, status code changes
    - Store contract fixtures alongside the code they describe, so a breaking change and its
      fixture update land in the same commit
    - Report in CI as an annotation, never as a commit-time gate

    Solves: silent breakage when one component changes its API shape and the other finds out
    in production.
  priority: medium
  status: proposed
  value: |
    Deterministic in the strict sense: given two schema versions, the diff is a mechanical
    comparison with no judgement and no model.
    Catches integration failures at review time rather than after deploy.
    Keeps components decoupled — an API may change, provided the consumer's fixture changes
    with it and someone reviews both.
  acceptance_criteria:
    - "`make contract-check` outputs a structured diff report"
    - "A contract breakage annotates the run and does not block the commit hook"
    - "A repository with one component, or no schemas, reports `not applicable` rather than
       passing"
    - "Any tool used (pact, openapi-diff) is pinned to an exact version, or recorded
       `install: unavailable` with no version"