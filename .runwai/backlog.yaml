  - id: TODO-2
    title: Fix the check-ID verifier's regex
    state: closed
    phase: closed
    rank_reason: >-
      Verified defect, small fix, and the evidence integrity every generated report will
      rest on. Blocks TODO-1.
    verified_defect: true
    blocker: null
    summary: >-
      The verifier extracts check IDs with `CKV[A-Z_]*_[0-9]+`, which permits no digits
      inside the middle segment, so `CKV_K8S_19` never matches. Three Kubernetes checks
      are invisible to the gate meant to catch bad IDs.
    fix: use `CKV[A-Z0-9_]*_[0-9]+`
    occurrences:
      - .github/workflows/pr-gate.yml:149
      - .github/workflows/pr-gate.yml:150
      - capabilities/iac-network-exposure/README.md:46
      - capabilities/iac-network-exposure/README.md:47
    evidence:
      method: measured against checkov 3.3.8 and the live config
      extraction:
        claimed_ids_old: 18
        claimed_ids_new: 21
        known_ids_old: 1036
        known_ids_new: 1359
      invisible_to_gate: [CKV_K8S_19, CKV_K8S_20, CKV_K8S_21]
      gate_output_old: [CKV_GCP_5]
      gate_output_new: [CKV_GCP_5]
      gate_output_if_only_claimed_side_fixed:
        [CKV_GCP_5, CKV_K8S_19, CKV_K8S_20, CKV_K8S_21]
      k8s_ids_now_checked:
        - id: CKV_K8S_19
          checkov_says: Containers should not share the host network namespace
          comment_accurate: true
        - id: CKV_K8S_20
          checkov_says: Containers should not run with allowPrivilegeEscalation
          comment_accurate: true
        - id: CKV_K8S_21
          checkov_says: The default namespace should not be used
          comment_accurate: true
    notes: >-
      The regex damages both sides of the comparison, not just the claimed side, so
      fixing one file alone produces three false failures. Fix before TODO-1: closing
      TODO-1 first turns the build green while the Kubernetes IDs remain unexamined,
      which is worse than the current red because nothing prompts anyone to look. The
      gate tests existence, not correctness — CKV_AWS_340 and CKV_AWS_215 are real IDs
      that pass it while enforcing the wrong thing. A verifier with a blind spot is
      worse than no verifier: it reports success over the gap.
    resolution: >-
      Closed by TODO-15. The verifier lived in the pr-gate IaC job, which went with the capability it checked. The regex defect was real and is recorded here rather than fixed — if checkov ever returns, `CKV[A-Z0-9_]*_[0-9]+` is the correct pattern.

  - id: TODO-1
    title: Fix the checkov check allowlist
    state: closed
    phase: closed
    rank_reason: >-
      Verified defect. Fixing it before TODO-2 turns the build green over an unexamined gap.
    verified_defect: true
    blocker: null
    summary: >-
      Three of eighteen check IDs in the iac-network-exposure allowlist do not mean what
      their comments claim, and checkov silently ignores unknown IDs, so those controls
      never run.
    file: capabilities/iac-network-exposure/files/checkov.yaml
    evidence:
      method: audited against `checkov --list` (checkov 3.3.8 ships its registry, so offline)
      findings:
        - id: CKV_GCP_5
          claimed: GKE must not use legacy ABAC
          actual: does not exist
          action: remove, or replace with CKV_GCP_18 (GKE control plane not public)
        - id: CKV_AWS_340
          claimed: RDS clusters must not be publicly accessible
          actual: Ensure Elastic Beanstalk managed platform updates are enabled
          action: wrong check entirely; find the real RDS-cluster public-access ID
        - id: CKV_AWS_215
          claimed: CloudFront must not use deprecated TLS
          actual: Ensure AppSync API Cache is encrypted in transit
          action: wrong check entirely; find the real CloudFront TLS ID
        - id: CKV_AZURE_53
          claimed: PostgreSQL must deny public network access
          actual: the same, but for mySQL servers
          action: ID is valid, comment misleading; add the PostgreSQL equivalent
        - id: CKV_AWS_23
          claimed: listed under network segregation (ISM-1181)
          actual: Ensure every security group and rule has a description
          action: hygiene check, not a segregation control; move or drop
    fixed_in_passing: >-
      Two mislabelling defects found alongside the check-ID audit and already corrected,
      recorded because both were the kind that reads as competent work until checked.
      checkov.yaml's header and two of its section comments cited RWA-0030, RWA-0031 and
      RWA-0033 — supply-chain controls in the current registry, covering import
      restriction and SBOM and CBOM consumption — where the IaC controls are RWA-0040 and
      RWA-0041; debris from the renumbering TODO-4 records. Separately, the pr-gate job
      was named for RWA-0042 (backup resilience), which has `capability: null` and no
      check in this config enforcing it, so the job name claimed a control nothing runs.
      Neither touches the allowlist itself, which is still wrong in the five ways above.
    depends_on: [TODO-2]
    see_also: >-
      RWA-0042 remains a blocking pr-gate control in the registry with no capability and
      no mechanism behind it. Removing the claim from the job name made the workflow
      honest; it did not make the control real. That is a registry-integrity question of
      the same family as TODO-4's four issues.
    resolution: >-
      Closed by TODO-15. capabilities/iac-network-exposure and its checkov allowlist are deleted, so the five wrong check IDs are gone with the file. The audit stands as a record of what an unverified allowlist costs, and CKV_GCP_5 is why CI was red for the life of this branch.

  - id: TODO-9
    title: Make capabilities opt-in and not-applicable-aware
    state: closed
    phase: closed
    rank_reason: >-
      IaC is the case that proves why this change is needed, and it is the case we cannot
      reach yet. Detecting whether a project has infrastructure worth scanning means knowing
      what the cloud providers and the community actually ship to work with — skills,
      commands, or a registry of MCP servers for managing cloud — and that list does not
      exist here. Ranked low because it cannot be started honestly, not because the
      first-run experience stopped mattering.
    blocker: >-
      No sourced list of provider- or community-supplied IaC skills and commands, and no
      registry of cloud-management MCP servers to derive applicability from.
    summary: >-
      The repository assumes every adopter has the subject matter each capability scans.
      A project with no Terraform still runs the iac job's check-ID verification, and
      today that job fails — over CKV_GCP_5, for a check that would never have run on
      their code. Their first experience is a red build about a cloud they do not use.
    principle: >-
      Absent subject matter is not a finding, and it is not a pass either. Both are lies
      to a user who cannot tell the difference.
    tasks:
      - Detection per capability — no IaC files present means `not applicable`, and the
        job passes. Same for containers, releases, anything whose subject can be absent.
      - "`not applicable` as a first-class result, distinct from `passed` wherever it is
        reported."
      - Capability-level opt-out in one obvious file, so a project says "no
        infrastructure" once rather than suppressing findings repeatedly. Opt-outs appear
        in the security report as excluded, with the reason — an invisible opt-out is a
        hole in the artefact.
      - Rebalance pre-commit. Six blocking hooks fire on every commit today, including
        full SAST and three repository self-checks. Commit time should hold the secret
        scan and little else; everything structural belongs in the PR gate, which
        already re-runs it.
      - Self-check integrity — a capability reporting `not applicable` on a repository
        that does contain its subject matter is a defect, and should be caught the way
        TODO-2 catches an extraction blind spot.
    direction:
      nothing_blocks_the_adopter: >-
        For a project built from this template, no capability blocks. The value is that
        the right things are seeded in advance — someone building a product does not think
        to prompt an AI about infrastructure exposure — and that there is a feedback
        channel on the security and robustness of what they have built, which they consult
        if and when they want to. A gate that stops them is not that. This retires the
        advisory/blocking posture field that an earlier shape proposed: with no blocking
        side, there is nothing to declare and nothing to toggle.
      applicability_is_not_a_glob_problem: >-
        An earlier shape put a glob set in capability.yaml as the evidence of subject
        matter. Withdrawn. Deciding what counts as infrastructure worth scanning means
        knowing what providers and the community actually ship, and writing globs in place
        of that list is the fabrication failure AGENTS.md's verification-discipline section
        describes — fluent output about something nobody checked. This is the blocker
        above, and it is why the item moved down rather than being reshaped.
      decay_question_withdrawn: >-
        Whether `not applicable` should decay was asked of a glob, which cannot tell a
        project that never had Terraform from one that deleted it last week. Once
        applicability is derived from a sourced list rather than inferred from file names,
        it is not the question to answer.
    open_questions:
      - Whether a status computation is needed at all, and what it is worth. If nothing
        blocks, the honest readout may belong entirely to TODO-10's report rather than to a
        separate mechanism with its own file format and its own failure modes.
      - What it may be written in. Every self-check here is Python, and an adopter picking
        up this template may not have Python at all. A status tool that assumes a toolchain
        the template does not otherwise require pushes a setup step onto the person
        AGENTS.md promises a one-step start.
    unresolved_scope: >-
      "Nothing blocks" is settled for an adopting project. Two boundaries are not, and
      both need an explicit call before any gate is rewritten. First, the secret scan:
      README argues it must block on save because a credential that reaches a pull request
      is already public and must be rotated rather than deleted, which is an argument
      about irreversibility rather than about strictness. Second, runwAI's own gates on
      its own repository, which are how the template's self-checks stay honest and are a
      different question from what an adopter experiences.
    consequence_of_moving: >-
      Deferring this keeps the CKV_GCP_5 failure visible, which is the outcome TODO-2's
      notes want. Closing TODO-9 first would have marked the capability not applicable
      here — runwAI has no IaC of its own — turning the build green while three
      Kubernetes IDs remained unexamined, the same hazard TODO-2 describes for closing
      TODO-1 first, reached through a different door.
    resolution: >-
      Closed by TODO-15. The item existed because the repository failed projects that had no IaC. There is no IaC capability now, and the two checks that remain read source files, so absent subject matter reports nothing rather than failing. The principle survives in AGENTS.md; the machinery it needed does not have to be built.

