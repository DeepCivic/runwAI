# runwAI development backlog.
#
# runwAI's own outstanding work. Not the adopting project's backlog, and not the
# security backlog that TODO-10 will generate from scanner findings.
#
# Structured rather than prose so an agent can query it without reading a 300-line
# README section.
#
# An ID is identity, not order. IDs are stable, cited from commit messages across the
# history, and never reused or renumbered — renumbering them would make those citations
# point at the wrong work. `rank` carries the order instead, and the file is written in
# rank order so reading top to bottom is the work order. When priorities change, change
# rank and re-sort; leave the IDs alone.
#
# state:       open | partly-done | shape-decided | closed
# rank:        1 is next. Absent on closed items.
# phase:       now | next | later | blocked | closed
# rank_reason: why this position, so a re-ranking is an argument rather than a reshuffle
# blocker:     null when actionable now
# evidence:    only present where a claim was measured by running something

version: 1

# What v1 is, and what it is not.
#
# Three things, and the scanners that feed them. Items carrying `v1: true` are in; the rest
# are ranked below them and are not gated on. Scope set 2026-07-26.
v1_scope:
  - Curated and rationalised meta architecture. Done — one canonical command list with thin
    vendor adapters, recorded as decision 4.
  - ISM compliance checked in GitHub CI, producing a file that tracks current state.
    Non-blocking. Done — security-report.md and the `posture` workflow. TODO-10 stays open
    for the noise control and generated backlog that wait on TODO-8.
  - A machine-friendly breakdown of ISM requirements with semantic tags per control.
    Done — controls/ism-tags.yaml and the generated controls/ism-index.json. TODO-13.
  - semgrep stays, thinned to one or two practical rulesets. Done — two rulesets, 9 rules,
    down from four and 23. TODO-14. "Standard" is not met and cannot be on the obvious
    upstream, for the licensing reason in TODO-16.
v1_excluded:
  infrastructure: >-
    Gone rather than deferred. TODO-15 deleted the IaC capability, which closed TODO-1,
    TODO-2 and TODO-9 with it — all three existed only to make that capability correct or
    survivable.
  release_evidence: >-
    SBOM, CBOM, signing and the release-gate workflow went with the capability that fed
    them. Real work, and a later version's.
  everything_else: >-
    TODO-8, TODO-4, TODO-3, TODO-7 and TODO-5 are real and none of them blocks v1.

# Outstanding before the template is released.
#
# Not a second backlog. The ranked items below are the work; this is the shorter list of
# things a release decision turns on — open decisions, and risks that local verification
# cannot close. Written 2026-07-26, after v1's four items landed.
before_release:
  ci_status: >-
    `pr-gate` was deleted and its worthwhile jobs — selfcheck, ruleset-tests, bandit and the
    full-history secret scan — were folded into `posture`, which now carries five jobs and
    still blocks nothing. All of them ran green as pr-gate jobs immediately before the move,
    so the parts are known-good and the arrangement is not. The next run is the first real
    test of the new shape.

    What was deliberately not carried over: pr-gate's `semgrep --error` pass. `posture`
    already runs the same two rulesets over the same tree in report mode and keeps the
    findings, and the pre-commit hook still runs them with `--error` locally. A second CI
    pass differing only in its exit code would have reported the same findings twice and
    re-created a merge gate under another name.
  open_decisions:
    - >-
      The mapping_fidelity gap, recorded against TODO-4. Controls mapped with no mechanism
      still read as `partial` coverage to anyone not reading their notes, because the
      vocabulary has no way to say "mapped, nothing runs". Now cheaper than it was: the enum
      lives in validate_registry.py rather than a JSON Schema, so adding a value is a code
      change rather than a schema change.
    - >-
      Where report.md belongs. It sits at the root and describes runwAI's own contents,
      not the adopter's — its generator and freshness gate both live in .runwai/, so an
      adopter who deletes that tree keeps a root-level report about a repository they no
      longer have. security-report.md is the adopter-facing one and is correctly placed.
  known_and_accepted:
    - >-
      pre-commit runs seven hooks on save, which used to be described as a gate in the wrong
      place. Removing the PR gate changed the argument rather than settling it: pre-commit
      is now the only place in the repository where a check stops anything, so thinning it
      would move those checks somewhere that merely reports. Whether that trade is worth
      making is open. The prior framing — "they are re-run at the merge boundary, so nothing
      would be lost" — is no longer available, because there is no merge boundary.
    - >-
      The committed security-report.md will drift from reality between runs. That is the
      accepted cost of having no staleness gate on it; the generation timestamp is what
      makes the drift visible. The posture workflow's drift notice now compares with the
      timestamp line stripped — the first version fired on every run without exception,
      because the timestamp guarantees a difference.
    - >-
      24 of 1101 controls carry no rationale in ism-index.json, because their block could
      not be located in the published text. Recorded as null rather than approximated.
    - >-
      agents/skills/ still reads like a directory a skill runtime loads, and is not one.
      Argued and accepted in decision 4 — the alternative traded the layer's vendor
      neutrality for one tool's convenience.

items:
  - id: TODO-15
    title: Cut the template back to what v1 does
    state: closed
    phase: closed
    v1: true
    summary: >-
      Eighty-one files across twenty-six directories for four things. The capability layer
      was built for a library of many capabilities and the product ships two rulesets, so
      the ceremony cost more than it bought.
    resolution: >-
      capabilities/ and schemas/ are gone — 12 of 26 directories and 20 of 81 files. The two
      surviving rulesets live at controls/rules/ with their fixtures at controls/tests/. The
      three facts a capability manifest carried — which gate runs it, which files carry it,
      where they came from — moved onto the control itself as an `implementation` block, so
      a control either has a mechanism in this repository or visibly does not.
    what_went_and_why:
      - >-
        iac-network-exposure. Served none of the four v1 items and its check-ID verifier was
        the only red job in CI for the life of the branch.
      - >-
        sbom-release-gate, and release-gate.yml with it. The workflow existed to run a
        capability nobody kept; shipping it empty would have been coverage theatre.
      - >-
        schemas/. Two JSON Schemas guarding two files. The rules they carried — required
        fields, enums, identifier patterns — are now thirty lines in validate_registry.py.
        The determinism invariant was never in the schema: it is Python, and untouched.
    what_stayed:
      - >-
        secret-scanning-precommit became a control record rather than a directory. Its
        mechanism was always in .pre-commit-config.yaml, so only metadata moved.
      - >-
        .steal/ untouched by instruction. Its two rows had to follow the files they point
        at, which is the manifest check working rather than a change of substance.
    semgrep_test_needs_two_directories: >-
      The one place the flattening pushed back. `semgrep --test` pairs a rules directory
      with a parallel fixture directory by filename and refuses more than one config, so
      loose rule files in controls/ could not be tested. controls/rules/ and controls/tests/
      is the shape that works, and it runs both rulesets in one pass — 8 assertions where
      the per-capability loop ran 4 and 4.
    evidence:
      method: measured against the tree, with the pinned scanners installed and run
      directories_before: 26
      directories_after: 15
      files_before: 81
      files_after: 66
      top_level_entries_before: 22
      top_level_entries_after: 20
      ruleset_assertions: 8
      semgrep_targets_scanned: 6
      semgrep_findings: 0

  - id: TODO-16
    title: '"Standard" semgrep rules are blocked by licensing, not effort'
    state: closed
    phase: closed
    v1: true
    summary: >-
      v1 asks for "1-2 standard and practical rules". Practical is met. Standard is not, and
      the reason is worth recording so nobody spends a day rediscovering it.
    finding: >-
      semgrep/semgrep-rules — the obvious upstream, and what "standard" would mean in
      practice — ships under a bespoke "Semgrep Rules License v1.0" whose terms live behind
      a URL, not under a recognised permissive licence. Resolved at commit
      81634cfc9e68dc5f238a8062909a60ba34500648 over the git protocol, using the procedure in
      agents/skills/vendor-upstream-content.
    consequence: >-
      Decision 1 vendors only where the licence is permissive, and the provenance record
      wants an SPDX identifier, which a bespoke licence does not supply. Vendoring it would
      pass an unassessed licence obligation to every adopter of the template. So the nine
      rules stay original, and the honest statement of item 4 is "1-2 practical rulesets of
      our own", not "standard".
    notes: >-
      This is not a permanent no. A permissively licensed ruleset from elsewhere would
      satisfy it, and TODO-3 is the item that would exercise the path.

  - id: TODO-14
    title: Thin the semgrep rulesets to what is practical
    state: closed
    phase: closed
    v1: true
    summary: >-
      Four rulesets and 23 rules was more surface than a first release should defend. Keep
      what is practical for someone shipping a product; retire the rest rather than leaving
      them wired and unexamined.
    resolution: >-
      Two rulesets, 9 rules. semgrep-injection-baseline stays (5 rules — SQL, shell and HTML
      sinks; the classic case and language-agnostic in practice) and unsafe-deserialisation
      stays (4 rules — pickle, marshal, unsafe YAML, eval, and pickled model loading, which
      is squarely the audience building AI products). weak-crypto-baseline and
      web-session-hardening are deleted.
    why_those_two_went: >-
      weak-crypto-baseline was 9 rules and its own README documented non-security MD5 —
      cache keys, ETags — as a known false-positive class, which made it the noisiest thing
      shipped. web-session-hardening was 5 rules, three of them JavaScript rules with no
      .js fixture, so they were asserted in neither direction and `semgrep --test` passed
      over the gap; it also carried the WARNING-versus-ISM-2032 contradiction TODO-4
      records.
    deleted_not_unwired: >-
      Decision 2 forbids inert content, so a ruleset kept in the tree but dropped from the
      gates was not an option. The files are gone and recoverable from history.
    consequences_handled:
      - RWA-0012, RWA-0023 and RWA-0060 now have a null capability and are no longer
        blocking, with notes saying what was retired and why. The security report renders
        them in its "mapped, nothing runs" row rather than as coverage.
      - Removed from the pre-commit hook, the pr-gate SAST job, the posture workflow and
        the command reference. Two job names that enumerated the retired controls were
        corrected rather than left over-claiming.
      - Two rows left .steal/manifest.md. The manifest check would have failed on them,
        which is the check doing its job.
      - The missing web-session.js fixture is moot rather than fixed.
    schema_gap_found: >-
      `mapping_fidelity: none` was the natural way to record "mapped, nothing runs" and the
      schema rejects it — the enum is direct, partial, supporting. Changing schemas/ is on
      AGENTS.md's ask-first list, so the controls use the established convention instead:
      capability null, blocking false, fidelity partial, and the argument in notes. Worth
      a decision in TODO-4, because "partial fidelity with no mechanism" reads as coverage
      to anyone not reading the notes.
    evidence:
      rulesets_before: 4
      rulesets_after: 2
      rules_before: 23
      rules_after: 9
      controls_with_a_capability_before: 11
      controls_with_a_capability_after: 8

  - id: TODO-8
    title: Measure real-world false-positive rates
    state: open
    rank: 1
    phase: next
    rank_reason: >-
      Dependency of TODO-10's noise control. A first report full of false positives is never
      opened twice.
    blocker: a substantial codebase to scan
    summary: >-
      The 9 semgrep rules that survive TODO-14 are asserted only against fixtures written
      alongside them. Fixtures confirm a rule does what its author intended; they say
      nothing about noise on real code.
    notes: >-
      Promoted from nice-to-have by TODO-10. Advisory scanners on a young codebase can
      produce hundreds of findings, and a first security report that reads as hopeless is
      never opened twice. Severity ordering and a flat cap of 25 shipped with TODO-10; a
      cap tuned to reality still depends on knowing the real rates. TODO-14 removed the
      noisiest ruleset unmeasured, on a documented false-positive class rather than on
      data, so this is now the measurement that would confirm the judgement was right.
    blocks: [TODO-10]

  - id: TODO-10
    title: Plain-language ISM posture readout
    state: partly-done
    rank: 2
    phase: next
    v1: true
    rank_reason: >-
      The v1 artefact ships and is honest. What remains is the part that needs TODO-8's
      false-positive rates and TODO-14's thinned rulesets underneath it, so it waits on
      both rather than being finished twice.
    blocker: null
    summary: >-
      A truthful, continuously updated answer to "how does what I have built compare to
      the ISM?", written for someone who has never read the ISM and will not start now.
    shipped: >-
      security-report.md, generated by .github/scripts/security_report.py and run by the
      `posture` workflow on every push and pull request. Blocks nothing, publishes to the
      job summary, uploads as an artifact. It reports what ran, what the scanners found
      severity-ordered and capped at 25, and where the repository sits against all 1101
      ISM controls in four buckets read from controls/ism-index.json.
    generator_location: >-
      .github/scripts/, not .runwai/tools/. Decision 3 sends maintainer Python to
      .runwai/, but this is not maintainer Python — it produces the thing an adopter
      adopted runwAI for. Putting it in .runwai/ would mean a setup agent following
      AGENTS.md prunes the feature along with the record it was told to delete. It is CI
      machinery, so it sits with the CI.
    three_honesty_guards: >-
      Each of these was a wrong first draft, corrected before it shipped. "Checked here"
      became "has a check behind it", because a capability wired to the release gate has
      not run on this commit and one whose subject matter is absent did not run either;
      the per-control table now carries the gate so the claim is checkable per row. An
      empty findings section now distinguishes "no scanner output was supplied" from "the
      scanners ran and found nothing" — the first draft rendered both as "No findings".
      And the unassessed bucket carries an explicit warning that it is not a to-do list:
      a control whose evidence lives in infrastructure nobody declares is out of reach
      even though its surface is not organisational.
    advisory_is_not_a_weakened_gate: >-
      The workflow header argues this where someone would object to it. The scan uses
      `|| true`, which agents/rules/ci-never-weaken-a-gate.md exists to prohibit — the
      difference is that the exit code is replaced by captured JSON rather than discarded,
      and the report says so when that file is missing or unreadable. A discarded exit
      code with nothing kept is what makes a silent scanner indistinguishable from a clean
      one. The pr-gate still runs the same rulesets with --error.
    no_staleness_gate_by_design: >-
      The committed copy is not pushed from CI. A bot commit per run would churn history
      for a timestamp, and the timestamp is what makes a stale copy visible without a
      gate. The workflow emits a notice when the tree's copy has drifted from the run.
    remaining:
      - Noise control beyond the flat cap of 25. Severity ordering is in; a cap tuned to
        real rates needs TODO-8, and the rates worth measuring are TODO-14's thinned set
        rather than today's 23 rules.
      - The generated security backlog — findings plus unimplemented controls, ordered and
        ready to open as issues. Deliberately outside v1 — a backlog generated from rules
        that are about to be thinned would be rewritten immediately.
      - Commit-time regeneration that stages itself. v1 is CI-only, which is what was
        asked for; the pre-commit half needs the speed budget below settled first.
      - A speed budget. Whole-tree scans per commit are not viable; changed files at
        commit, full scan in CI, and the report saying which produced what. The
        `--scan-scope` argument exists for that and is passed the CI commit today.
      - Where the convention triggers live — a Dockerfile appears, an auth library is
        added — mapping a pattern to the decision it raises.
    evidence:
      method: generated against the committed tree with synthetic and real scanner input
      buckets: {has_a_check: 22, mapped_nothing_runs: 30, unassessed: 702, out_of_scope: 347}
      ism_controls: 1101
      paths_asserted:
        - 40 findings render severity-ordered and cap at 25 with the remainder counted
        - a scanner that ran and found nothing reads differently from no scanner at all
        - an unreadable findings file is reported as incomplete, not as clean
        - a missing findings file is reported rather than silently skipped
        - a missing ism-index.json exits 2 with the command that fixes it

