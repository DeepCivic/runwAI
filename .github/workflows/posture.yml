# RWA posture: where this repository stands, and whether its own structure still holds.
#
# THIS WORKFLOW BLOCKS NOTHING, AND NOTHING ELSE HERE DOES EITHER.
#
# runwAI ships no merge gate. Preventing a merge is branch protection — a forge setting on
# the repository, not a file a template can carry — so a template that claimed one would be
# describing something it cannot install. The jobs below fail loudly and turn the run red
# when something is wrong; that is a signal to a human, not an enforcement boundary.
#
# The one place a check actually stops something is `.pre-commit-config.yaml`, on the
# developer's own machine, and even that is bypassable with `--no-verify`.
#
# The scanners run in report mode here so the report carries real findings rather than
# coverage alone. `|| true` on a scan is deliberate and paired with a captured JSON file —
# an exit code that is discarded without capturing what produced it is the thing
# agents/rules/ci-never-weaken-a-gate.md actually objects to, because a silent scanner is
# indistinguishable from a clean one.
#
# Scanners are installed from PyPI at exact versions rather than through third-party
# marketplace actions. That keeps the trusted surface to one registry and the pins
# reviewable in one place.
name: posture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-report:
    name: ISM posture report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned tooling
        run: pip install pyyaml==6.0.3 semgrep==1.171.0

      # The report is built from the index, so a stale index would silently produce a stale
      # posture. Regenerating rather than checking keeps this job independent of whether
      # the committed index is current; the selfcheck job below is what notices staleness.
      - name: Regenerate the ISM semantic index
        run: python3 .runwai/tools/ism.py index

      # Report mode: findings are captured to JSON rather than turned into an exit code.
      # `|| true` is what makes this advisory, and it is safe here only because the JSON is
      # kept — the report reads it, and says so when the file is missing or unreadable.
      - name: Scan (advisory)
        run: |
          set -uo pipefail
          semgrep scan --json --output semgrep.json --metrics=off --quiet \
            --config controls/rules/injection.yaml \
            --config controls/rules/deserialisation.yaml \
            --config controls/rules/path-traversal.yaml \
            . || true
          test -f semgrep.json || echo '{"results": [], "errors": ["scan produced no output"]}' > semgrep.json

      # RWA-0031 / RWA-0032. Runs in this job rather than its own so that one report is
      # built from everything that ran — a dependency audit in a separate job would have
      # to hand its result across an artifact for the report to include it, and a report
      # assembled from two jobs is a report that can silently lose half its input.
      #
      # The two networked steps are separated from the scan for the same reason the
      # Makefile separates them: `audit.py` itself never fetches a database mid-scan, so
      # the scan below is offline against exactly what was downloaded here, and its
      # snapshot date lands in the report.
      - name: Install the pinned dependency scanners
        run: make setup-audit-tools

      - name: Download the vulnerability database
        run: |
          echo "$PWD/.audit-cache/bin" >> "$GITHUB_PATH"
          PATH="$PWD/.audit-cache/bin:$PATH" make setup-audit-dbs

      # Advisory, exactly like the semgrep step above: the exit code is discarded and the
      # JSON is kept, so a scanner that failed is distinguishable from one that found
      # nothing. audit.py writes the JSON on every outcome including "could not run", and
      # the report reads which of them happened.
      - name: Audit dependencies (advisory)
        run: make audit || true

      - name: Build the report
        run: |
          python3 .github/scripts/security_report.py \
            --findings semgrep.json \
            --audit .audit-cache/audit.json \
            --scan-scope "the whole tree, in CI, on commit ${GITHUB_SHA:0:12}"

      # Visible without downloading anything: the report is the job summary.
      - name: Publish to the job summary
        run: cat docs/security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            docs/security-report.md
            docs/dependencies.md
          retention-days: 90

      # The committed copy is regenerated by whoever runs the script, not pushed from here.
      # A bot commit on every run would churn the history for a timestamp, and the timestamp
      # on the file is what makes a stale copy visible without a staleness check.
      #
      # Compared with the timestamp line stripped. The first version of this step diffed the
      # whole file, so it fired on every run without exception — the timestamp guarantees a
      # difference — and a notice that is always true carries no information at all.
      - name: Note if the committed copy has drifted
        run: |
          strip() { grep -v '^_Generated ' "$1"; }
          if ! diff -q <(strip docs/security-report.md) <(git show HEAD:docs/security-report.md | grep -v '^_Generated ') >/dev/null 2>&1; then
            echo "::notice::docs/security-report.md in the tree differs from this run in content, not just its timestamp. Regenerate with: python3 .github/scripts/security_report.py"
          fi
          # dependencies.md carries no timestamp at all, so it is compared whole. A diff
          # here means the dependency set moved without the committed bill of materials
          # moving with it — which is the one thing that would make it misleading.
          if ! diff -q docs/dependencies.md <(git show HEAD:docs/dependencies.md) >/dev/null 2>&1; then
            echo "::notice::docs/dependencies.md in the tree differs from this run. Regenerate with: make audit"
          fi
        shell: bash

  doctor:
    name: Environment parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Its own job, unlike the audit, because it needs nothing installed — bash and
      # coreutils only — and because what it reports on is the environment rather than the
      # code. A red job here is a signal that a declared variable or a pinned runtime is
      # missing, which is exactly the failure that is invisible until someone else clones
      # the repository. It blocks nothing, like every other job in this file.
      #
      # A project that declares no environment requirements reports `not applicable` and
      # exits 0, so this is green on a repository that has nothing to declare rather than
      # nagging it into declaring something.
      - name: Doctor
        run: bash .github/scripts/doctor.sh

  selfcheck:
    name: runwAI self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned tooling
        run: pip install pyyaml==6.0.3 jsonschema==4.26.0

      # Structure, determinism invariant, tool pinning, implementation provenance.
      - name: Validate the control registry
        run: python3 .runwai/tools/validate_registry.py

      # Every ISM ID and its authoritative wording, against controls/ism-snapshot.json.
      - name: Verify ISM claims
        run: python3 .runwai/tools/ism.py verify

      # The semantic index is generated from the snapshot, controls/ism-tags.yaml and the
      # published source text. Regenerating on an unchanged tree is byte-identical, so this
      # compares content rather than churn.
      - name: Check ISM semantic index is current
        run: python3 .runwai/tools/ism.py index --check

      # AI helper layer: link integrity, rule indexing, root config pins, ADR format.
      # Stdlib only, so it needs nothing installed. No paths passed, so the STEAL marker
      # sweep reads the whole tree — this run is the authoritative one.
      - name: Validate AI helper layer
        run: python3 .runwai/tools/validate_helpers.py

      # .runwai/docs/report.md is generated and committed. It contains no timestamps, so this
      # compares content rather than churn — a failure here means the tree changed
      # and the report was not regenerated.
      - name: Check generated report is current
        run: python3 .runwai/tools/report.py --check

  verification:
    name: Verification receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned scanners
        run: pip install semgrep==1.171.0 detect-secrets==1.5.0

      # Proves the checks catch what they claim: every rule against its committed
      # fixtures in both directions, twice (identical verdicts required), the fixture
      # floor, and the secret scanner against a canary generated at run time.
      # --no-install-check because a CI checkout has no commit hook, and a job that is
      # red for a reason no reader here can fix teaches readers to ignore the job.
      # The || capture keeps bash -e from aborting before the summary's closing fence
      # is written, so a failed run still renders readably in the job summary.
      - name: Run the verification receipts
        run: |
          set -o pipefail
          status=0
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/verify.py --no-install-check | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  ruleset-tests:
    name: Ruleset tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install semgrep
        run: pip install semgrep==1.171.0

      # Asserts each rule fires on the bad case AND stays quiet on the safe one.
      # The negative assertions are the point: a rule that cannot tell them apart
      # is noise, and noise gets the ruleset switched off.
      #
      # This is the only place the both-directions assertion runs. `.pre-commit-config.yaml`
      # scans an adopter's code with these rules; nothing there checks the rules themselves.
      #
      # semgrep --test pairs a rules directory with a parallel fixture directory by
      # filename: controls/rules/injection.yaml against controls/tests/injection.{py,js}.
      # That pairing is why the rules sit in their own directory rather than loose in
      # controls/ — one config plus one target tree, and both rulesets run in one pass.
      - name: Test rulesets
        run: semgrep --test --metrics=off --config controls/rules controls/tests

  python-sast:
    name: "Bandit over the Python we ship"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit==1.9.4

      # Both trees that hold Python: the self-checks and the report generator. Semgrep is
      # not repeated here — the security-report job already runs the same two rulesets over
      # the same tree and keeps what they found, and a second pass differing only in its
      # exit code would report the same findings twice.
      - name: Bandit
        run: bandit -r .runwai/tools/ .github/scripts/ -ll

  secrets:
    name: "Secret scan (RWA-0010 / ISM-2030)"
    runs-on: ubuntu-latest
    # KeyHog scans here; detect-secrets stays on the commit hook. Two scanners rather than
    # one is deliberate and the split is not arbitrary:
    #
    #   * detect-secrets is `language: python` in .pre-commit-config.yaml, so pre-commit
    #     installs it itself and setup stays one command. KeyHog's own hook is
    #     `language: system` — it runs whatever binary is on PATH, which means an install
    #     step for the adopter and a scanner whose version nothing pins. Neither is
    #     acceptable on the hook, and both are fine on a runner we control.
    #   * A runner can afford the wider scan. KeyHog carries far more detectors than
    #     detect-secrets' plugin set and walks reachable history, not just tracked files.
    #
    # The cost, stated plainly: the local and CI verdicts can now differ, because two
    # different tools with two different corpora are asking the question. A commit that
    # passes the hook can still be flagged here. That is the trade — CI is the wider net,
    # not a re-run of the hook.
    steps:
      - uses: actions/checkout@v4
        with:
          # --git-history walks only the ancestry present in the clone, and checkout
          # defaults to fetch-depth 1. Without this the history pass silently narrows to a
          # single commit and reports a clean scan of almost nothing.
          fetch-depth: 0

      # Pinned to the full commit SHA behind v0.5.47, not the `@v0` tag the README
      # suggests: a major tag moves, and a scanner that can change under you is a
      # non-deterministic control. This is the tool's own action, from the repository that
      # publishes the binary, so it is not a third-party wrapper around someone else's
      # scanner — which is the trusted-surface concern this file's header is about.
      #
      # Licence MIT OR Apache-2.0, read from LICENSE-MIT and LICENSE-APACHE in the upstream
      # tree at this commit. Permissive, so nothing propagates to an adopter.
      - name: KeyHog (working tree)
        uses: santhreal/keyhog@19bb6b0945584ff28341e4fd5e7a32c1b90602c7 # v0.5.47
        with:
          path: .
          # Lower than the action's `high` default. A leaked credential graded medium is
          # still a leaked credential, and this repository would rather triage noise than
          # discover the floor was set above the finding.
          severity: medium
          format: sarif
          # OFF, and it must stay off. --verify sends candidate secrets to vendor APIs to
          # see which are live. That makes the check non-deterministic — the verdict
          # depends on a third party's state at scan time — and it turns a scanner into an
          # egress path for the very material it just found.
          verify: 'false'
          # Code Scanning upload needs `security-events: write`, and this workflow is
          # `contents: read`. A template must not widen its own permissions for a feature
          # an adopter's repository may not even have enabled; the SARIF is kept as an
          # artifact below instead.
          upload-sarif: 'false'
          fail-on-findings: 'true'
          # Explicit rather than `auto`: autoroute picks a backend from what the runner
          # happens to have, and a check that selects its own engine per machine is not
          # reproducible. cpu is the one that is always present.
          backend: cpu

      # The action scans the working tree. History is a separate pass, and it is the one
      # that catches a credential committed behind `--no-verify` and removed later.
      #
      # The action installs keyhog onto PATH, so the CLI is available here. If that ever
      # stops being true this fails loudly rather than skipping: a secret scan that
      # silently does not run is indistinguishable from one that found nothing.
      - name: KeyHog (reachable history)
        run: |
          set -euo pipefail
          command -v keyhog >/dev/null 2>&1 || {
            echo "::error title=KeyHog::keyhog is not on PATH after the action step, so the history scan did not run."
            exit 1
          }
          keyhog scan --git-history . --backend cpu --severity medium --format sarif \
            --output keyhog-history.sarif

      # Runs even when a scan failed: the report of what was found is most useful exactly
      # when the job is red.
      - name: Upload the SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyhog-sarif
          path: |
            *.sarif
            keyhog-history.sarif
          if-no-files-found: warn
          retention-days: 90
